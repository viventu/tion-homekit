name: Ошибка
description: Сообщить о воспроизводимой проблеме без личных данных
body:
  - type: markdown
    attributes:
      value: |
        Для уязвимостей используйте SECURITY.md. Не прикладывайте пароли, коды сопряжения, NVS, полный Flash, MAC и необработанную страницу диагностики.
  - type: input
    id: version
    attributes:
      label: Версия образа
      description: Например, 0.2.0-gm1; если версия неизвестна, так и напишите.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Оборудование
      description: Модель стика, модель бризера и версия контроллера без серийных номеров.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Какие действия были выполнены и в каком порядке?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Укажите безопасные для публикации диагностические метрики, если они есть.
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Восстановление
      description: Работает ли бризер штатным пультом, прекращены ли команды HomeKit и что помогло?
    validations:
      required: false
